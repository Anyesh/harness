# Copy this folder to ~/.config/harness/profiles/<name>/ and run
# ./install.sh --profile <name>. The installer never reads this copy.
#
# Every key is optional; an unknown key fails the install so a typo cannot
# silently do nothing. Lists are comma separated. For each kind, *_only and
# *_exclude cannot both be set, because one picks and the other drops.

# memory=off drops second-brain and the wiki (hooks, rules, skill, commands, MCP).
memory=on

# work=on keeps personal context away from this profile: its wiki is
# <vault>/Work/agent-wiki, and it gets no me skill, no second-brain rule or MCP
# and no LLM preference rule. Unset, a settings.json here that sets
# env.ANTHROPIC_BASE_URL means on, and otherwise the machine's HARNESS_WORK in
# ~/.harness.env decides. A base URL set any other way (shell, launcher) is not
# seen, so set work=on for such a profile. work=off makes a personal profile on
# a work machine.
# work=on

# Skills by folder name under ~/.claude/skills.
skills_exclude=procedural-film, collage-film

# Rules by file name under configs/shared/rules, with or without .mdc.
# rules_only= with an empty value keeps none of main's rules.
rules_exclude=python, runbooks

# Commands by file name under ~/.claude/commands, with or without .md.
# commands_only=commit, scope
