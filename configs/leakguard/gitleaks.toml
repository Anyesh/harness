title = "leakguard: generic personal-info and secret patterns for pre-commit and publish scans"

[extend]
useDefault = true

[[rules]]
id = "machine-local-path"
description = "Machine-local absolute path that should not ship"
regex = '''(/mnt/data/|/mnt/c/Users/)'''
keywords = ["/mnt/data/", "/mnt/c/users/"]

[[rules]]
id = "private-lan-ip"
description = "Private LAN or tailnet address (10/8, 172.16/12, 192.168/16, 100.64/10)"
regex = '''\b(10\.\d{1,3}|172\.(1[6-9]|2\d|3[01])|192\.168|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7]))\.\d{1,3}\.\d{1,3}\b'''
keywords = ["10.", "172.", "192.168.", "100."]

[allowlist]
description = "Use inline '#gitleaks:allow' for one-off intentional mentions"
# The ruleset and its tests necessarily contain the guarded patterns.
paths = ['''configs/leakguard/gitleaks\.toml''', '''tests/test_leakguard\.sh''']
