title = "leakguard: personal info and secret patterns for pre-commit and publish scans"

[extend]
useDefault = true

[[rules]]
id = "personal-machine-username"
description = "Personal machine or account username"
regex = '''(?i)\b(haurka|chihiro)\b'''
keywords = ["haurka", "chihiro"]

[[rules]]
id = "personal-email"
description = "Personal email address"
regex = '''[\w.+-]+@anyesh\.me'''
keywords = ["anyesh.me"]

[[rules]]
id = "homelab-domain"
description = "Homelab domain"
regex = '''(?i)\byumeko\.me\b'''
keywords = ["yumeko"]

[[rules]]
id = "machine-local-path"
description = "Machine-local absolute path that should not ship"
regex = '''(/home/haurka|/mnt/data/|/mnt/c/Users/)'''
keywords = ["/home/haurka", "/mnt/data/", "/mnt/c/users/"]

[[rules]]
id = "private-lan-ip"
description = "Private LAN address"
regex = '''\b192\.168\.\d{1,3}\.\d{1,3}\b'''
keywords = ["192.168."]

[allowlist]
description = "Intended public identity; use inline '#gitleaks:allow' for one-off intentional mentions"
regexes = ['''https?://(www\.)?anyesh\.me''', '''github\.com/Anyesh''']
# The ruleset and its tests necessarily contain the guarded patterns.
paths = ['''configs/leakguard/gitleaks\.toml''', '''tests/test_leakguard\.sh''']
