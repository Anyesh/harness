[limits]
grep_max_results = 500
grep_max_per_file = 50
status_max_files = 30
status_max_untracked = 20
passthrough_max_chars = 8000

[display]
max_width = 120
colors = true
emoji = true

[filters]
ignore_dirs = [".git", "node_modules", "target", "__pycache__", ".venv", "vendor"]
ignore_files = ["*.lock", "*.min.js", "*.min.css"]
