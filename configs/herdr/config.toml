onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[ui]
status_indicators = "symbols"
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "free -h | awk '/^Mem/ {print \"mem \" $3 \"/\" $2}'", interval_seconds = 10, timeout_seconds = 2 },
  { type = "hostname" },
  { type = "datetime", format = "%a %H:%M" },
]
tab_bar_right_separator = " · "

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "$title"],
  ["$provider", "$limit"],
  ["$cache_high", { token = "$cache_mid", fg = "#e0af68" }, { token = "$cache_low", fg = "#f7768e" }],
  ["$context"],
]

[[keys.command]]
key = "prefix+alt+t"
type = "popup"
command = "btop"
description = "btop system monitor"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-$HOME}\" && exec \"${SHELL:-sh}\""
description = "scratch terminal in this pane's directory"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+g"
type = "plugin_action"
command = "herdr-lazygit.open"
description = "lazygit in a split"

[[keys.command]]
key = "prefix+shift+alt+g"
type = "plugin_action"
command = "herdr-lazygit.open-tab"
description = "lazygit in its own tab"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr diff review"

[[keys.command]]
key = "prefix+alt+d"
type = "plugin_action"
command = "herdr-dagr.open-dagr"
description = "open dagr"

[[keys.command]]
key = "prefix+alt+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "plugin manager"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "agent usage limits"

[[keys.command]]
key = "prefix+alt+u"
type = "plugin_action"
command = "usagebar.refresh"
description = "refresh agent usage meters"

[[keys.command]]
key = "prefix+alt+o"
type = "plugin_action"
command = "godview.open"
description = "godview: every agent and its subagents"

[[keys.command]]
key = "prefix+alt+l"
type = "plugin_action"
command = "herdr-plugin-workspace-manager.apply"
description = "apply the workspace-manager layout"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "jump to any tab, pane, agent, repo or branch"
