[package]
name = "workview"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "One live view of work across every repo, worktree and branch."
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
notify = "8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = "thin"
opt-level = "s"
